# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Domain\:
        resource: '../src/Domain'
        exclude:
            - '../src/Domain/Entity'
            - '../src/Domain/ViewModel'

    Application\Query\:
        resource: '../src/Application/Query'
        autowire: true
        autoconfigure: true

    Application\Command\:
        resource: '../src/Application/Command'
        autowire: true
        autoconfigure: true

    Infrastructure\Repository\:
        resource: '../src/Infrastructure/Repository'
        autowire: true
        autoconfigure: true
        bind:
            string $apiUrl: '%env(SUPABASE_URL)%'
            string $apiKey: '%env(SUPABASE_API_KEY)%'

    Infrastructure\Symfony\Controller\:
        resource: '../src/Infrastructure/Symfony/Controller'
        tags: ['controller.service_arguments']

    Infrastructure\:
        resource: '../src/Infrastructure'
        exclude:
            - '../src/Infrastructure/Symfony/Controller'
            - '../src/Infrastructure/Twig'

    Infrastructure\Entity\Doctrine\Mapper\NoteMapperDoctrine:
        arguments:
            $participationMapper: '@Infrastructure\Entity\Doctrine\Mapper\ParticipationMapperDoctrine'

    Infrastructure\Entity\Doctrine\Mapper\ParticipationMapperDoctrine:
        arguments:
            $teamMapper: '@Infrastructure\Entity\Doctrine\Mapper\TeamMapperDoctrine'
            $playerMapper: '@Infrastructure\Entity\Doctrine\Mapper\PlayerMapperDoctrine'
            $matchMapper: '@Infrastructure\Entity\Doctrine\Mapper\MatchMapperDoctrine'

    Infrastructure\Entity\Doctrine\Mapper\MatchMapperDoctrine:
        arguments:
            $teamMapper: '@Infrastructure\Entity\Doctrine\Mapper\TeamMapperDoctrine'

    Infrastructure\Entity\Doctrine\Mapper\PlayerMapperDoctrine:
        arguments:
            $teamMapperDoctrine: '@Infrastructure\Entity\Doctrine\Mapper\TeamMapperDoctrine'

    Infrastructure\Service\GoogleAPISearch\GoogleApiLinkProfileTransfermarktSearcher:
        autowire: true
        autoconfigure: true
        bind:
            string $apiKey: '%env(GOOGLE_SEARCH_API_KEY)%'
            string $cx: '%env(GOOGLE_SEARCH_API_CX)%'

    Infrastructure\Service\APIFootball\ApiFootballFetchBaseDataProvider:
        autowire: true
        autoconfigure: true
        bind:
            string $apiKey: '%env(FOOTBALL_API_KEY)%'

    Domain\Repository\ParticipationRepository: '@Infrastructure\Repository\Doctrine\ParticipationRepositoryDoctrine'
    Domain\Repository\PlacementRepository: '@Infrastructure\Repository\Doctrine\PlacementRepositoryDoctrine'
    Domain\Repository\PositionRepository: '@Infrastructure\Repository\Doctrine\PositionRepositoryDoctrine'
    Domain\Repository\PlayerRepository: '@Infrastructure\Repository\Doctrine\PlayerRepositoryDoctrine'
    Domain\Repository\TeamRepository: '@Infrastructure\Repository\Doctrine\TeamRepositoryDoctrine'
    Domain\Repository\ChampionshipRepository: '@Infrastructure\Repository\Doctrine\ChampionshipRepositoryDoctrine'
    Domain\Repository\MatchRepository: '@Infrastructure\Repository\Doctrine\MatchRepositoryDoctrine'
    Domain\Mapper\PlayerMapper: '@Infrastructure\Entity\Doctrine\Mapper\PlayerMapperDoctrine'
    Domain\Mapper\NoteMapper: '@Infrastructure\Entity\Doctrine\Mapper\NoteMapperDoctrine'
    Domain\Mapper\TeamMapper: '@Infrastructure\Entity\Doctrine\Mapper\TeamMapperDoctrine'
    Domain\Mapper\PositionMapper: '@Infrastructure\Entity\Doctrine\Mapper\PositionMapperDoctrine'
    Domain\Mapper\PlacementMapper: '@Infrastructure\Entity\Doctrine\Mapper\PlacementMapperDoctrine'
    Domain\Mapper\ChampionshipMapper: '@Infrastructure\Entity\Doctrine\Mapper\ChampionshipMapperDoctrine'

    Application\Query\FetchPlayers\FetchPlayersOutputBoundary: '@Domain\Presenter\FetchPlayers\FetchPlayersJsonPresenter'
    Domain\Presenter\ShowDetailsPlayer\ShowDetailsPlayerOutputBoundary: '@Infrastructure\Json\Presenter\ShowDetailsPlayerPresenterJson'

